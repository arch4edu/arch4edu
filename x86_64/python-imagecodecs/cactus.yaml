nvchecker:
  - source: aur
    aur:
  - alias: python
  - alias: jxrlib
depends:
  - x86_64/brunsli
  - x86_64/lerc
  - x86_64/lzfse
  - any/python-imread
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  sed '/del EXTENSIONS\["zfp"\]/d' -i PKGBUILD
  add depends zfp
  # jxrlib moved its headers; pass its pkg-config flags into the wheel build
  sed -i 's|python -m build --wheel|CFLAGS="$(pkg-config --cflags libjxr) ${CFLAGS:-}" python -m build --wheel|' PKGBUILD
post_build: aur-post-build
