nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/libccd
  - x86_64/octomap
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  sed -i "s/license=('BSD')/license=('BSD-3-Clause')/; s/makedepends=('cmake' 'octomap')/makedepends=('cmake')/; s/depends=('libccd' 'eigen')/depends=('libccd' 'eigen' 'octomap')/; s/optdepends=('octomap: collision detection with octrees'/optdepends=(/" PKGBUILD
  sed -i 's/-DCMAKE_BUILD_TYPE="Release"/-DCMAKE_BUILD_TYPE="Release" -DCMAKE_POLICY_VERSION_MINIMUM=3.5/' PKGBUILD
  sed -i '/^build() *{/a\  export CXXFLAGS+=" -ffile-prefix-map=$srcdir=/usr/src/debug/$pkgname"' PKGBUILD
  sed -i '/^package() *{/,/^}/ s/^package()/_package()/' PKGBUILD
  cat >> PKGBUILD <<'CACTUSEOF'

  prepare() {
      sed -i 's/-std=c++11/-std=c++14/g' "$srcdir/$_dir/CMakeModules/CompilerSettings.cmake" "$srcdir/$_dir/CMakeLists.txt"
      while IFS= read -r -d '' header; do
          grep -qE '#include <(cassert|assert.h)>' "$header" || sed -i '0,/^#include /s//#include <cassert>\n&/' "$header"
      done < <(grep -rIlZE '(^|[^[:alnum:]_])assert[[:space:]]*\(' "$srcdir/$_dir/include")
  }

  package() {
      _package
      install -Dm644 "$srcdir/$_dir/LICENSE" "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
  }
  CACTUSEOF
post_build: aur-post-build
