nvchecker:
  - source: aur
    aur:
  - alias: python
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add makedepends meson-python cmake
  echo 'export MKLROOT=/opt/intel/oneapi/mkl/latest' >> PKGBUILD
  echo 'export CMAKE_PREFIX_PATH="/opt/intel/oneapi/mkl/latest${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"' >> PKGBUILD
post_build: aur-post-build
