nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/ros2/gz-cmake3
  - x86_64/ros2/gz-math7
  - x86_64/ros2/gz-tools2
  - x86_64/ros2/gz-utils2
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add depends python-protobuf gcc-libs glibc
  # PR 499 is included in the 10.4.0 tag; applying it again fails.
  sed -i '/^prepare() *{/,/^}/d' PKGBUILD
  sed -i "s/^arch=('any')$/arch=('x86_64')/" PKGBUILD
post_build: aur-post-build
