nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/ros2/gz-cmake3
  - x86_64/ros2/gz-msgs10
  - x86_64/ros2/gz-utils2
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add depends python ruby sqlite util-linux-libs abseil-cpp glibc
  sed -i "s/^arch=('any')$/arch=('x86_64')/" PKGBUILD
post_build: aur-post-build
