nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/ros2/ros2-humble
  - x86_64/opencv4
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  # Remove leading "##" from exclusion placeholders
  sed -i 's/^##//' PKGBUILD
post_build: aur-post-build

depends_ros2-humble-cv-bridge:
  - x86_64/ros2/ros2-humble
  - x86_64/opencv4
depends_ros2-humble-image-geometry:
  - x86_64/ros2/ros2-humble
  - x86_64/opencv4
depends_ros2-humble-vision-opencv:
  - x86_64/ros2/ros2-humble-vision-opencv: ros2-humble-cv-bridge
  - x86_64/ros2/ros2-humble-vision-opencv: ros2-humble-image-geometry
