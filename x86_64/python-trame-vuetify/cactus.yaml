nvchecker:
  - source: aur
    aur:
  - alias: python
depends:
  - x86_64/python-trame-client
build_prefix: extra-x86_64
makepkg_args: --nocheck
pre_build: |
  aur-pre-build
  replace "sed -i 's/^include/#include/' \${_base}-\${pkgver}/MANIFEST.in" "[ -f \${_base}-\${pkgver}/MANIFEST.in ] && sed -i 's/^include/#include/' \${_base}-\${pkgver}/MANIFEST.in || true"
post_build: aur-post-build
