nvchecker:
  - source: aur
    aur:
depends:
  - any/gz-cmake3
  - x86_64/freeimage
  - x86_64/gz-math7
  - x86_64/gz-utils2
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add depends gcc-libs glib2
  # PR 672 is included in the 5.9.0 tag; applying it again fails.
  sed -i '/^prepare() *{/,/^}/d' PKGBUILD
  sed -i "s/^arch=('any')$/arch=('x86_64')/" PKGBUILD
post_build: aur-post-build
