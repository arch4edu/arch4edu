nvchecker:
  - source: aur
    aur:
  - alias: python
depends:
  - x86_64/dune-common
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add makedepends python-requests
  sed -i 's/-DCMAKE_CXX_FLAGS="-O2 -Wall/-DCMAKE_CXX_FLAGS="-O2 -Wall -Wno-template-body/' PKGBUILD
  sed -i 's/-DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=FALSE/-DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=TRUE/' PKGBUILD
  cat > fix-thex.sh << 'SCRIPT'
  #!/bin/bash
  sed -i '/th__ex\./d' dune/istl/dilu.hh dune/istl/ilu.hh
  sed -i 's/<< e\.what();$/<< e.what());/' dune/istl/dilu.hh dune/istl/ilu.hh
  sed -i 's/; th__ex\.r = i\.index(); th__ex\.c = ij\.index() );/);/' dune/istl/ildl.hh
  SCRIPT
  chmod +x fix-thex.sh
  sed -i '/cd ${pkgname}-${pkgver}/a\  bash ${startdir}/fix-thex.sh' PKGBUILD
post_build: aur-post-build
