nvchecker:
  - source: aur
    aur:
  - alias: python
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  git checkout HEAD -- gcc16.patch
  sed -i 's|tar.gz)$|tar.gz gcc16.patch)|' PKGBUILD
  sed -i "s|')|' 'SKIP')|" PKGBUILD
  sed -i '/cd \${_base}-\${_base}-\${pkgver}$/a\  patch -Np1 -i "$srcdir/gcc16.patch" || true' PKGBUILD
post_build: aur-post-build
