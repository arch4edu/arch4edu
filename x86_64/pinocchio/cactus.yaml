nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/coal
  - x86_64/eigenpy
  - x86_64/urdfdom
  - x86_64/casadi
makedepends:
  - any/jrl-cmakemodules
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add makedepends pybind11
  sed -i 's/-DBUILD_WITH_CASADI_SUPPORT=ON/-DBUILD_WITH_CASADI_SUPPORT=OFF/' PKGBUILD
  cat >> PKGBUILD <<'CACTUSEOF'

  prepare() {
      sed -i '/^namespace pinocchio$/i\
  namespace pinocchio::graph {\
    inline bool operator==(const Geometry & lhs, const Geometry & rhs) { return &lhs == &rhs; }\
  }\
  ' "$srcdir/$pkgbase-$pkgver/bindings/python/parsers/graph/expose-geometries.cpp"
  }
  CACTUSEOF
post_build: aur-post-build
