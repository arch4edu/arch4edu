nvchecker:
  - source: aur
    aur:
depends:
  - x86_64/r/r-rcppparallel
  - x86_64/r/r-rcppeigen
build_prefix: extra-x86_64
makepkg_args: --nocheck
pre_build: |
  aur-pre-build
  if ! grep -q '^+    CXXFLAGS <- paste0.*DTBB_INTERFACE_NEW' fix-flags.patch; then
    sed -i '/^+  if (file\.exists(file\.path(TBB_DIR, "version\.h"))) {$/a\+    CXXFLAGS <- paste0("-I", shQuote(TBB_INC), " -D_REENTRANT -DSTAN_THREADS -DTBB_INTERFACE_NEW")' fix-flags.patch
    sed -i -e 's/^@@ -5,8 +5,12 @@/@@ -5,8 +5,13 @@/' \
           -e 's/^@@ -30,7 +34,7 @@/@@ -30,7 +35,7 @@/' \
           -e 's/^@@ -38,7 +42,12 @@/@@ -38,7 +43,12 @@/' fix-flags.patch
    updpkgsums
  fi
post_build: aur-post-build
