nvchecker:
  - source: aur
    aur:
makedepends:
  - any/jrl-cmakemodules
makepkg_args: --nocheck
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  cat >> PKGBUILD <<'CACTUSEOF'

  prepare() {
      sed -i '/add_subdirectory(unittest)/d' "$srcdir/$pkgbase-$pkgver/CMakeLists.txt"
  }
  CACTUSEOF
post_build: aur-post-build
