nvchecker:
  - source: http
    url: https://kvrt.arch4edu.org/x86_64/stamp.txt
    regex: '(\d{12})'
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  # Upstream CDN blocks CI networks; payload + version stamp are mirrored to R2 (kvrt-sync worker, every 6h).
  rm -f kvrt.stamp
  sed -i 's|https://devbuilds.s.kaspersky-labs.com/devbuilds/kvrt_linux/latest/kvrt.run|https://kvrt.arch4edu.org/x86_64/kvrt.run|' PKGBUILD
  sed -i 's|source_x86_64=("$pkgname-$pkgver-$pkgrel.run::|source_x86_64=("kvrt.run::|' PKGBUILD
  sed -i 's|binwalk -M -q -e $pkgname-$pkgver-$pkgrel.run|binwalk -M -q -e kvrt.run|' PKGBUILD
  sed -i 's|install -Dm775 "$pkgname-$pkgver-$pkgrel.run"|install -Dm775 kvrt.run|' PKGBUILD
  sed -i 's|extractions/kvrt-|extractions/kvrt|' PKGBUILD
  sed -i "s|^b2sums_x86_64=('[a-f0-9]*')|b2sums_x86_64=('SKIP')|" PKGBUILD
  cat >> PKGBUILD <<'CACTUSEOF'

  source_x86_64+=("kvrt.stamp::https://kvrt.arch4edu.org/x86_64/stamp.txt")
  b2sums_x86_64+=('SKIP')

  pkgver() {
      printf '%s.%s' "${pkgver%%.202[0-9]*}" "$(<kvrt.stamp)"
  }
  CACTUSEOF
post_build: aur-post-build
