nvchecker:
  - source: aur
    aur:
  - alias: python
depends:
  - any/python-etils
  - x86_64/python-jax
  - any/python-jaxtyping
  - any/python-orbax-checkpoint
build_prefix: extra-x86_64
makepkg_args: --nocheck
pre_build: |
  aur-pre-build
  sed -i '/python -m build -nw/i\    sed -i "s/flit_core >=3.5,<4/flit_core >=3.5/" orbax-$_pkgver/export/pyproject.toml' PKGBUILD
post_build: aur-post-build
