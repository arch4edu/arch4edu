nvchecker:
  - source: aur
    aur:
makedepends:
  - any/jrl-cmakemodules
build_prefix: extra-x86_64
pre_build: |
  aur-pre-build
  add makedepends libmatio python-numpy
  add checkdepends python-scipy
  # Doxygen formulas need LaTeX; use MathJax instead of pulling in texlive.
  sed -i 's|-DBUILD_DOCUMENTATION=ON|-DBUILD_DOCUMENTATION=ON -DPROXSUITE_DOXYGEN_USE_MATHJAX=ON|' PKGBUILD
post_build: aur-post-build
