nvchecker:
  - source: regex
    url: https://kvrt.arch4edu.org/aarch64/stamp.txt
    regex: '(\d{12})'
build_prefix: extra-aarch64
makepkg_args: -A
pre_build: |
  aur-pre-build
  # Upstream CDN blocks CI networks; payload + version stamp are mirrored to R2 (kvrt-sync worker, every 6h).
  rm -f kvrt.stamp
  sed -i 's|https://devbuilds.s.kaspersky-labs.com/kvrt_linux/latest/arm-64/kvrt.run|https://kvrt.arch4edu.org/aarch64/kvrt.run|' PKGBUILD
  sed -i 's|source_aarch64=("$pkgname-$pkgver-$pkgrel.run::|source_aarch64=("kvrt.run::|' PKGBUILD
  sed -i 's|binwalk -M -q -e $pkgname-$pkgver-$pkgrel.run|binwalk -M -q -e kvrt.run|' PKGBUILD
  sed -i 's|install -Dm775 "$pkgname-$pkgver-$pkgrel.run"|install -Dm775 kvrt.run|' PKGBUILD
  sed -i 's|extractions/kvrt-|extractions/kvrt|' PKGBUILD
  sed -i "s|^b2sums_aarch64=('[a-f0-9]*')|b2sums_aarch64=('SKIP')|" PKGBUILD
  cat >> PKGBUILD <<'CACTUSEOF'

  source_aarch64+=("kvrt.stamp::https://kvrt.arch4edu.org/aarch64/stamp.txt")
  b2sums_aarch64+=('SKIP')

  pkgver() {
      printf '%s.%s' "${pkgver%%.202[0-9]*}" "$(<kvrt.stamp)"
  }
  CACTUSEOF
post_build: aur-post-build
